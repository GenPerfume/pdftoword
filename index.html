<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Word OCR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Thư viện đúng link -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
    <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

<div class="max-w-xl w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-8">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-blue-400 mb-2">PDF to Word OCR</h1>
        <p class="text-slate-400 text-sm">Tự động chia trang → OCR từng trang → Ghép 1 file Word</p>
    </div>

    <!-- Phần chọn file siêu đơn giản & ổn định -->
    <div class="border-2 border-dashed border-slate-600 rounded-xl p-8 text-center bg-slate-800/50">
        <input type="file" id="fileInput" accept=".pdf,application/pdf" class="block w-full text-sm text-slate-300
            file:mr-4 file:py-2.5 file:px-5
            file:rounded-lg file:border-0
            file:text-sm file:font-semibold
            file:bg-blue-600 file:text-white
            hover:file:bg-blue-500
            cursor-pointer mb-4">
        
        <p class="text-sm text-slate-400">Hoặc kéo thả file PDF vào đây</p>
        <div id="dropZone" class="mt-3 h-16 border border-slate-600 rounded-lg flex items-center justify-center text-slate-500 text-sm">
            Kéo thả vào đây
        </div>
    </div>

    <div id="fileStatus" class="hidden mt-6 bg-slate-700/40 p-4 rounded-xl border border-slate-600">
        <div class="flex items-center justify-between mb-2">
            <span id="fileName" class="text-sm font-medium truncate max-w-[220px]"></span>
            <span id="statusText" class="text-xs text-blue-400 font-semibold"></span>
        </div>
        <div class="w-full bg-slate-600 rounded-full h-2.5 overflow-hidden mb-2">
            <div id="progressBar" class="bg-blue-500 h-2.5 rounded-full w-0 transition-all duration-300"></div>
        </div>
        <p id="pageInfo" class="text-xs text-slate-400"></p>
    </div>

    <button id="convertBtn" disabled
        class="w-full mt-6 bg-slate-700 text-slate-500 font-bold py-3 rounded-xl cursor-not-allowed">
        Bắt đầu OCR từng trang
    </button>
</div>

<script>
    // Đợi thư viện load xong
    window.addEventListener('load', function () {
        const SERVER_URL = "https://pdf-ocr-backend-fcec.onrender.com";

        // Kiểm tra thư viện
        if (typeof PDFLib === 'undefined') {
            alert('Lỗi tải thư viện pdf-lib. Hãy tải lại trang!');
            return;
        }
        if (typeof docx === 'undefined') {
            alert('Lỗi tải thư viện docx. Hãy tải lại trang!');
            return;
        }

        const { PDFDocument } = PDFLib;
        const { Document, Packer, Paragraph, TextRun, HeadingLevel } = docx;

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const fileStatus = document.getElementById('fileStatus');
        const fileName = document.getElementById('fileName');
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');
        const pageInfo = document.getElementById('pageInfo');
        const convertBtn = document.getElementById('convertBtn');

        let selectedFile = null;

        // ===== CHỌN FILE (cách đơn giản nhất) =====
        fileInput.addEventListener('change', function (e) {
            if (e.target.files && e.target.files[0]) {
                handleFile(e.target.files[0]);
            }
        });

        // Kéo thả
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-blue-500', 'bg-slate-700');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-blue-500', 'bg-slate-700');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-blue-500', 'bg-slate-700');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        async function wakeServer() {
            try {
                await fetch(SERVER_URL + "/", { method: "GET" });
                return true;
            } catch {
                return false;
            }
        }

        async function handleFile(file) {
            if (!file.name.toLowerCase().endsWith('.pdf')) {
                alert('Vui lòng chọn file PDF!');
                fileInput.value = '';
                return;
            }

            selectedFile = file;
            fileName.textContent = file.name;
            fileStatus.classList.remove('hidden');
            statusText.textContent = 'Đang đánh thức Server...';
            statusText.className = 'text-xs text-yellow-400 font-semibold';
            progressBar.style.width = '5%';
            pageInfo.textContent = '';

            convertBtn.disabled = true;
            convertBtn.className = "w-full mt-6 bg-slate-700 text-slate-500 font-bold py-3 rounded-xl cursor-not-allowed";

            const ok = await wakeServer();
            if (ok) {
                statusText.textContent = 'Server sẵn sàng. Bấm nút để bắt đầu.';
                statusText.className = 'text-xs text-blue-400 font-semibold';
                progressBar.style.width = '10%';
                convertBtn.disabled = false;
                convertBtn.className = "w-full mt-6 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl cursor-pointer shadow-lg shadow-blue-500/30";
            } else {
                statusText.textContent = 'Không kết nối được Server!';
                statusText.className = 'text-xs text-red-400 font-semibold';
            }
        }

        // ===== Hàm OCR =====
        async function extractSinglePage(pdfBytes, pageIndex) {
            const srcDoc = await PDFDocument.load(pdfBytes);
            const newDoc = await PDFDocument.create();
            const [page] = await newDoc.copyPages(srcDoc, [pageIndex]);
            newDoc.addPage(page);
            return await newDoc.save();
        }

        async function pollStatus(taskId) {
            for (let i = 0; i < 80; i++) {
                const res = await fetch(`${SERVER_URL}/status/${taskId}`);
                if (!res.ok) throw new Error("Lỗi status");
                const data = await res.json();
                const st = (data.status || "").toLowerCase();
                if (["completed", "done", "success", "finished"].includes(st)) return data;
                if (["failed", "error"].includes(st)) throw new Error(data.error || data.message || "OCR fail");
                await new Promise(r => setTimeout(r, 3000));
            }
            throw new Error("Timeout");
        }

        async function convertOnePage(pageBytes, pageNum) {
            const formData = new FormData();
            formData.append("file", new Blob([pageBytes], { type: "application/pdf" }), `page_${pageNum}.pdf`);

            const uploadRes = await fetch(`${SERVER_URL}/convert`, { method: "POST", body: formData });
            if (!uploadRes.ok) throw new Error("Upload lỗi");

            const { task_id } = await uploadRes.json();
            if (!task_id) throw new Error("Không có task_id");

            await pollStatus(task_id);

            const dlRes = await fetch(`${SERVER_URL}/download/${task_id}`);
            const ct = (dlRes.headers.get("content-type") || "").toLowerCase();
            if (!dlRes.ok || ct.includes("json") || ct.includes("text")) {
                throw new Error(await dlRes.text() || "Lỗi download");
            }

            const blob = await dlRes.blob();
            if (blob.size < 1000) throw new Error("File quá nhỏ");
            return blob;
        }

        async function extractTextFromDocx(blob) {
            try {
                const result = await mammoth.extractRawText({ arrayBuffer: await blob.arrayBuffer() });
                return (result.value || "").trim();
            } catch {
                return "";
            }
        }

        // Nút Convert
        convertBtn.addEventListener('click', async () => {
            if (!selectedFile) return alert("Chưa chọn file!");

            convertBtn.disabled = true;
            convertBtn.className = "w-full mt-6 bg-slate-700 text-slate-500 font-bold py-3 rounded-xl cursor-not-allowed";
            statusText.textContent = 'Đang đọc PDF...';
            progressBar.style.width = '5%';

            try {
                const pdfBytes = await selectedFile.arrayBuffer();
                const pdfDoc = await PDFDocument.load(pdfBytes);
                const totalPages = pdfDoc.getPageCount();

                pageInfo.textContent = `Tổng ${totalPages} trang`;
                let success = 0, fail = 0;
                const allTexts = [];

                for (let i = 0; i < totalPages; i++) {
                    const pageNum = i + 1;
                    progressBar.style.width = (5 + (i / totalPages) * 85) + '%';
                    statusText.textContent = `Đang OCR trang ${pageNum}/${totalPages}...`;
                    pageInfo.textContent = `Thành công: ${success} | Lỗi: ${fail}`;

                    try {
                        const pageBytes = await extractSinglePage(pdfBytes, i);
                        const docxBlob = await convertOnePage(pageBytes, pageNum);
                        const text = await extractTextFromDocx(docxBlob);
                        allTexts.push({ page: pageNum, text: text || `[Trang ${pageNum} trống]` });
                        success++;
                    } catch (err) {
                        console.error(err);
                        allTexts.push({ page: pageNum, text: `[Trang ${pageNum} lỗi: ${err.message}]` });
                        fail++;
                    }
                    await new Promise(r => setTimeout(r, 500));
                }

                // Ghép Word
                statusText.textContent = 'Đang ghép file Word...';
                progressBar.style.width = '95%';

                const children = [
                    new Paragraph({
                        text: `Kết quả OCR - ${selectedFile.name}`,
                        heading: HeadingLevel.HEADING_1,
                        spacing: { after: 300 }
                    })
                ];

                allTexts.forEach(item => {
                    children.push(new Paragraph({
                        text: `--- Trang ${item.page} ---`,
                        heading: HeadingLevel.HEADING_2,
                        spacing: { before: 250, after: 120 }
                    }));
                    item.text.split(/\n+/).filter(t => t.trim()).forEach(line => {
                        children.push(new Paragraph({
                            children: [new TextRun({ text: line, size: 24 })],
                            spacing: { after: 80 }
                        }));
                    });
                });

                const doc = new Document({ sections: [{ children }] });
                const blob = await Packer.toBlob(doc);

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = selectedFile.name.replace(/\.pdf$/i, '') + '_OCR.docx';
                a.click();
                URL.revokeObjectURL(url);

                progressBar.style.width = '100%';
                statusText.textContent = `Hoàn tất! ${success}/${totalPages} trang thành công`;
                statusText.className = 'text-xs text-green-400 font-semibold';
                pageInfo.textContent = fail ? `Có ${fail} trang lỗi` : 'Tất cả trang OK';

            } catch (err) {
                console.error(err);
                alert('Lỗi: ' + err.message);
                statusText.textContent = 'Lỗi: ' + err.message;
                statusText.className = 'text-xs text-red-400 font-semibold';
            } finally {
                convertBtn.disabled = false;
                convertBtn.className = "w-full mt-6 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl cursor-pointer shadow-lg shadow-blue-500/30";
            }
        });
    });
</script>
</body>
</html>
