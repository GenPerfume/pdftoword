<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển Đổi PDF Sang Word Chuyên Sâu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-indigo-600 text-white rounded-lg">
                    <i data-lucide="file-text" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-bold text-slate-900">PDF2Word <span class="text-indigo-600 font-extrabold">PRO</span></h1>
            </div>
            <span class="text-xs bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-medium">Chế độ Chuyên Sâu (AI OCR)</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto w-full p-6 flex-grow flex flex-col justify-center">
        
        <!-- Upload Box -->
        <div id="drop-zone" class="border-2 border-dashed border-indigo-300 hover:border-indigo-500 bg-white rounded-2xl p-8 text-center transition-all cursor-pointer shadow-sm hover:shadow-md">
            <div class="flex flex-col items-center">
                <div class="p-4 bg-indigo-50 text-indigo-600 rounded-full mb-4">
                    <i data-lucide="upload-cloud" class="w-10 h-10"></i>
                </div>
                <h2 class="text-lg font-semibold text-slate-800 mb-1">Kéo & Thả file PDF vào đây</h2>
                <p class="text-sm text-slate-500 mb-4">Hoặc nhấn để chọn file từ máy tính của bạn</p>
                <input type="file" id="file-input" accept=".pdf" class="hidden" />
                <button onclick="document.getElementById('file-input').click()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-colors shadow">
                    Chọn File PDF
                </button>
            </div>
        </div>

        <!-- File Info & Options (Hidden by default) -->
        <div id="file-details" class="hidden bg-white rounded-2xl p-6 border border-slate-200 shadow-sm mt-6">
            <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                <div class="flex items-center space-x-3">
                    <i data-lucide="file-code-2" class="w-8 h-8 text-red-500"></i>
                    <div>
                        <p id="file-name" class="font-semibold text-slate-800 truncate max-w-xs">document.pdf</p>
                        <p id="file-size" class="text-xs text-slate-500">0 MB</p>
                    </div>
                </div>
                <button id="remove-file" class="text-slate-400 hover:text-red-500 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Conversion Options -->
            <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                <label class="border border-slate-200 p-4 rounded-xl flex items-start space-x-3 cursor-pointer hover:border-indigo-500 transition-colors bg-slate-50">
                    <input type="radio" name="mode" value="layout" checked class="mt-1 text-indigo-600 focus:ring-indigo-500">
                    <div>
                        <span class="block font-medium text-sm text-slate-800">Bảo toàn Layout chuẩn</span>
                        <span class="block text-xs text-slate-500 mt-0.5">Giữ nguyên định dạng, bảng biểu, hình ảnh từ file PDF gốc.</span>
                    </div>
                </label>
                <label class="border border-slate-200 p-4 rounded-xl flex items-start space-x-3 cursor-pointer hover:border-indigo-500 transition-colors bg-slate-50">
                    <input type="radio" name="mode" value="ocr" class="mt-1 text-indigo-600 focus:ring-indigo-500">
                    <div>
                        <span class="block font-medium text-sm text-slate-800">Quét OCR Chuyên Sâu</span>
                        <span class="block text-xs text-slate-500 mt-0.5">Dành cho PDF dạng ảnh chụp/scanned. Nhận diện chữ tiếng Việt.</span>
                    </div>
                </label>
            </div>

            <!-- Action Button -->
            <button id="convert-btn" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition-colors shadow flex justify-center items-center space-x-2">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                <span>Bắt Đầu Chuyển Đổi</span>
            </button>
        </div>

        <!-- Progress/Status Box -->
        <div id="status-box" class="hidden bg-white rounded-2xl p-6 border border-slate-200 shadow-sm mt-6 text-center">
            <div id="loading-spinner" class="inline-block animate-spin text-indigo-600 mb-3">
                <i data-lucide="loader-2" class="w-8 h-8"></i>
            </div>
            <p id="status-text" class="font-medium text-slate-800">Đang xử lý tài liệu...</p>
            <div class="w-full bg-slate-100 rounded-full h-2 mt-4 overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-2 rounded-full w-0 transition-all duration-300"></div>
            </div>
            
            <!-- Download Button -->
            <a id="download-btn" href="#" download class="hidden mt-6 inline-flex items-center space-x-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-3 rounded-xl transition-colors shadow">
                <i data-lucide="download" class="w-5 h-5"></i>
                <span>Tải File Word (.docx)</span>
            </a>
        </div>

    </main>

    <script>
        lucide.createIcons();

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileDetails = document.getElementById('file-details');
        const fileName = document.getElementById('file-name');
        const fileSize = document.getElementById('file-size');
        const convertBtn = document.getElementById('convert-btn');
        const statusBox = document.getElementById('status-box');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');
        const downloadBtn = document.getElementById('download-btn');
        let selectedFile = null;

        // Drag and drop handlers
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); });
        });

        dropZone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length && files[0].type === 'application/pdf') {
                handleFileSelection(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFileSelection(e.target.files[0]);
        });

        function handleFileSelection(file) {
            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
            dropZone.classList.add('hidden');
            fileDetails.classList.remove('hidden');
        }

        document.getElementById('remove-file').addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            fileDetails.classList.add('hidden');
            dropZone.classList.remove('hidden');
            statusBox.classList.add('hidden');
        });

        // Trigger conversion process
        convertBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            fileDetails.classList.add('hidden');
            statusBox.classList.remove('hidden');
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('mode', document.querySelector('input[name="mode"]:checked').value);

            try {
                // Tỉ lệ tiến trình giả định để làm hiệu ứng
                let progress = 10;
                const interval = setInterval(() => {
                    if (progress < 90) {
                        progress += 10;
                        progressBar.style.width = progress + '%';
                    }
                }, 400);

                // Gửi request lên Backend (Thay đổi URL API Backend thực tế của bạn)
                const response = await fetch('/api/convert-pdf', {
                    method: 'POST',
                    body: formData
                });

                clearInterval(interval);

                if (response.ok) {
                    const blob = await response.blob();
                    const downloadUrl = URL.createObjectURL(blob);
                    
                    progressBar.style.width = '100%';
                    statusText.textContent = 'Chuyển đổi thành công!';
                    document.getElementById('loading-spinner').classList.add('hidden');
                    
                    downloadBtn.href = downloadUrl;
                    downloadBtn.download = selectedFile.name.replace('.pdf', '.docx');
                    downloadBtn.classList.remove('hidden');
                } else {
                    throw new Error('Chuyển đổi thất bại');
                }
            } catch (err) {
                statusText.textContent = 'Đã có lỗi xảy ra. Vui lòng kiểm tra lại backend!';
                progressBar.classList.add('bg-red-500');
            }
        });
    </script>
</body>
</html>
